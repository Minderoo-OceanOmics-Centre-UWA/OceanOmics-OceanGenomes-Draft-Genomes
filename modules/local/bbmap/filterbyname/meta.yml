name: bbmap_filterbyname
description: Filter assembly contigs based on an action report and summarise excluded fragments.
keywords:
  - fasta
  - assembly
  - filter
  - bbmap
tools:
  - bbmap:
      description: Suite of bioinformatics tools for manipulating and filtering assemblies and reads.
      homepage: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/
      documentation: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/filterbyname/
      licence: ["UC-LBL license (see package)"]
      identifier: biotools:bbmap

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample', assembly_prefix:'assembly' ]
    - action_report:
        type: file
        description: Decontamination action report describing contigs to exclude, trim or review.
    - reads:
        type: file
        description: Assembly FASTA file to be filtered.
  - - output_format:
        type: string
        description: Optional format string passed via `task.ext.args`; retained for pipeline compatibility.

output:
  - first_filtered:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample', assembly_prefix:'assembly' ]
      - "*.rf.fa":
          type: file
          description: Assembly with contigs flagged for review/exclusion removed.
          pattern: "*.rf.fa"
  - filter_report:
      - "*.filter_report.txt":
          type: file
          description: Summary of the number and total length of contigs excluded, trimmed and reviewed.
          pattern: "*.filter_report.txt"
  - names_to_filter:
      - "*.review_scaffolds_1kb.txt":
          type: file
          description: List of contig identifiers flagged for review under 1 kb.
          pattern: "*.review_scaffolds_1kb.txt"
  - contigs_under_500bp:
      - "*.contig_count_500bp.txt":
          type: file
          description: Count of contigs remaining below 500 bp length after filtering.
          pattern: "*.contig_count_500bp.txt"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"

authors:
  - "@tokarevvasily"
  - "@sppearce"
  - "@tpeirce"

maintainers:
  - "@sppearce"
  - "@tpeirce"
