name: create_samplesheet
description: Build a validated samplesheet from downloaded reads and SQL metadata.
keywords:
  - samplesheet
  - metadata
  - psycopg2
  - csv
tools:
  - python:
      description: Python with psycopg2 for SQL lookup and CSV writing.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]

input:
  - - reads_list:
        type: list
        description: List of sample IDs and read paths used to construct the samplesheet.
    - config:
        type: file
        description: PostgreSQL connection config for metadata lookup.

output:
  - samplesheet:
      - "*.csv":
          type: file
          description: Generated samplesheet for the run.
          pattern: "*_samplesheet.csv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"

authors:
  - "@tpeirce"

maintainers:
  - "@tpeirce"
