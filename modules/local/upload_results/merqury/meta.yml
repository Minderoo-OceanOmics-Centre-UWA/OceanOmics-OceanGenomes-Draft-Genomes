name: push_merqury_results
description: Upload Merqury completeness and QV metrics to the SQL database.
keywords:
  - merqury
  - kmer
  - qv
  - upload
  - sql
tools:
  - python:
      description: Python with psycopg2 for database insertion.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata (id, prefix, run, date).
    - completeness_stats:
        type: file
        description: Merqury completeness stats file.
        pattern: "*.completeness.stats"
    - qv_tsv:
        type: file
        description: Merqury QV TSV file.
        pattern: "*.qv"
    - config:
        type: file
        description: PostgreSQL connection config.

output:
  - upload:
      - "*.merqury.upload.txt":
          type: file
          description: Log of database upload operations for Merqury metrics.
          pattern: "*.merqury.upload.txt"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"

authors:
  - "@tpeirce"

maintainers:
  - "@tpeirce"
