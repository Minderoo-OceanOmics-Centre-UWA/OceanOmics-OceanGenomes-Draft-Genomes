name: push_decontamination_results
description: Upload decontamination metrics (FCS-GX, adaptor, Tiara, contig counts) to the SQL database.
keywords:
  - decontamination
  - fcs-gx
  - tiara
  - upload
  - sql
tools:
  - python:
      description: Python with psycopg2 for database insertion.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata (id, prefix, run, date).
    - filter_report:
        type: file
        description: BBMap filterbyname report with counts of excluded/trimmed/reviewed contigs.
        pattern: "*.filter_report.txt"
    - contigs_under_500bp:
        type: file
        description: Contig count summary for fragments under 500 bp.
        pattern: "*.contig_count_500bp.txt"
    - tiara_filter_summary:
        type: file
        description: Tiara filter summary file.
        pattern: "*.tiara_filter_summary.txt"
    - config:
        type: file
        description: PostgreSQL connection config.

output:
  - upload:
      - "*.decontamination.upload.txt":
          type: file
          description: Log of database upload operations for decontamination metrics.
          pattern: "*.decontamination.upload.txt"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"

authors:
  - "@tpeirce"

maintainers:
  - "@tpeirce"
