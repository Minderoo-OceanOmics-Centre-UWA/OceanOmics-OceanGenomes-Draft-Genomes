name: push_gfa_results
description: Upload GFAstats assembly summaries to the SQL database.
keywords:
  - gfastats
  - assembly
  - upload
  - sql
tools:
  - python:
      description: Python with psycopg2 for database insertion.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata (id, prefix, run, date).
    - gfastats_results:
        type: file
        description: GFAstats assembly summary file.
        pattern: "*.assembly_summary"
    - config:
        type: file
        description: PostgreSQL connection config.

output:
  - upload:
      - "*.gfastats.upload.txt":
          type: file
          description: Log of database upload operations for GFAstats metrics.
          pattern: "*.gfastats.upload.txt"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"

authors:
  - "@tpeirce"

maintainers:
  - "@tpeirce"
