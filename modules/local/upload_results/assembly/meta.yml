name: push_assembly_results
description: Upload GenomeScope/assembly summary metrics to the SQL database.
keywords:
  - assembly
  - genomescope2
  - upload
  - sql
tools:
  - python:
      description: Python with psycopg2 for database insertion.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]

input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata (id, prefix, run, date).
    - genomescope_summary:
        type: file
        description: GenomeScope2 summary file to upload.
        pattern: "*_summary.txt"
    - config:
        type: file
        description: PostgreSQL connection config.

output:
  - upload:
      - "*.assembly.upload.txt":
          type: file
          description: Log of database upload operations for assembly metrics.
          pattern: "*.assembly.upload.txt"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions.
          pattern: "versions.yml"

authors:
  - "@tpeirce"

maintainers:
  - "@tpeirce"
